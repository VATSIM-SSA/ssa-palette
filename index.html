<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VATSSA Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',sans-serif;background:#07262C;min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:28px;overflow-x:hidden}
  .card{width:100%;max-width:640px;background:#0B2A30;border-radius:26px;overflow:hidden;
        box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative}

  /* hero */
  .hero{background:linear-gradient(90deg,#0197B0 0%,#7BD758 100%);padding:46px 38px 40px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;
       background:radial-gradient(130% 90% at 82% 18%,rgba(255,255,255,.22),transparent 58%)}
  .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 9s ease-in-out infinite}
  .orb.a{width:120px;height:120px;background:rgba(255,255,255,.18);top:-40px;right:60px}
  .orb.b{width:70px;height:70px;background:rgba(255,255,255,.14);bottom:-20px;left:30px;animation-delay:-3s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .wm{position:relative;font-family:'Jost',sans-serif;font-weight:200;letter-spacing:.4em;
      color:#F8F3F0;font-size:clamp(40px,11vw,64px);line-height:1;padding-left:.4em;
      opacity:0;animation:rise .8s ease forwards}
  .tag{position:relative;font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.5em;
      color:#F8F3F0;opacity:.92;font-size:11px;text-transform:uppercase;margin-top:14px;padding-left:.5em;
      animation:rise .8s ease .12s forwards;opacity:0}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* body */
  .body{padding:34px 38px 40px}
  .lbl{font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.22em;font-size:11px;
       text-transform:uppercase;color:#3EB0C3;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#13414A,transparent)}

  .primaries{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px}
  .chip{border-radius:18px;height:130px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;
        position:relative;overflow:hidden;animation:pop .6s cubic-bezier(.2,.8,.3,1.1) both}
  .chip:nth-child(1){animation-delay:.25s}.chip:nth-child(2){animation-delay:.34s}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .chip .nm{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
  .chip .hx{font-family:'Jost',sans-serif;font-weight:500;font-size:26px;letter-spacing:.02em}
  .chip.teal{background:#0197B0;color:#fff}
  .chip.green{background:#7BD758;color:#0B2A30}

  .ramp{display:flex;border-radius:14px;overflow:hidden;height:54px;margin-bottom:10px;
        box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .ramp i{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;
          font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.04em;
          opacity:0;animation:fade .5s ease forwards}
  .ramp.r1 i{animation-delay:calc(.45s + var(--i)*.03s)}
  .ramp.r2 i{animation-delay:calc(.6s + var(--i)*.03s)}
  @keyframes fade{to{opacity:1}}

  .foot{display:flex;align-items:center;gap:16px;margin-top:30px}
  .foot .gswatch{height:46px;flex:1;border-radius:12px;background:linear-gradient(90deg,#0197B0,#7BD758)}
  .foot .solid{width:46px;height:46px;border-radius:12px;background:#3FB885;flex:none}
  .foot .note{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.06em;color:#6f8d92;text-transform:uppercase;white-space:nowrap}
  .credit{margin-top:24px;padding-top:18px;border-top:1px solid #13414A;text-align:center;
          font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.22em;
          text-transform:uppercase;color:#5d797e}
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <span class="orb a"></span><span class="orb b"></span>
      <div class="wm">VATSSA</div>
      <div class="tag">Sub-Sahara Africa</div>
    </div>
    <div class="body">
      <div class="lbl">Primary Colours</div>
      <div class="primaries">
        <div class="chip teal"><span class="nm">Teal</span><span class="hx">#0197B0</span></div>
        <div class="chip green"><span class="nm">Green</span><span class="hx">#7BD758</span></div>
      </div>

      <div class="lbl">Teal Scale</div>
      <div class="ramp r1" id="r1"></div>

      <div class="lbl" style="margin-top:24px">Green Scale</div>
      <div class="ramp r2" id="r2"></div>

      <div class="foot">
        <div class="gswatch"></div>
        <div class="solid"></div>
        <div class="note">Gradient<br>+ #3FB885</div>
      </div>
      <div class="credit">Made by George (1768227)</div>
    </div>
  </div>
<script>
  const teal=['#EBF7F9','#D6EEF2','#A9DCE4','#76C7D4','#3EB0C3','#0197B0','#027F94','#046779','#054F5D','#063A44'];
  const green=['#F4FCF2','#EAF9E4','#D2F1C6','#B8E9A5','#9BE180','#7BD758','#66B44C','#529040','#3D6D34','#2A4D2A'];
  const lum=h=>{const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return .2126*r+.7152*g+.0722*b};
  function fill(id,arr){const el=document.getElementById(id);arr.forEach((c,i)=>{
    const d=document.createElement('i');d.style.background=c;d.style.setProperty('--i',i);
    d.style.color=lum(c)>140?'#0B2A30':'#F8F3F0';d.textContent=c.slice(1);el.appendChild(d);});}
  fill('r1',teal);fill('r2',green);
</script>
</body>
</html>
