<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VATSSA Palette</title>
<link rel="icon" href="logo_icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0197B0;--green:#7BD758;--bg:#07262C;--light:#F8F3F0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);min-height:100vh;
       padding:40px 28px;overflow-x:hidden}
  .card{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border:1px solid rgba(248,243,240,.08);
        border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}

  /* big branded header */
  .hero{background:var(--bg);padding:42px 34px 46px;position:relative;overflow:hidden;
        display:flex;flex-direction:column;align-items:center;gap:20px}
  .hero::before{content:"";position:absolute;inset:0;
       background:radial-gradient(58% 80% at 14% 8%,rgba(1,151,176,.40),transparent 60%),
                  radial-gradient(58% 82% at 90% 96%,rgba(123,215,88,.34),transparent 60%)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
       background:linear-gradient(90deg,var(--teal),var(--green))}
  .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 9s ease-in-out infinite}
  .orb.a{width:120px;height:120px;background:rgba(248,243,240,.06);top:-40px;right:60px}
  .orb.b{width:70px;height:70px;background:rgba(248,243,240,.05);bottom:10px;left:30px;animation-delay:-3s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* clean solid-bordered frames */
  .frame{position:relative;background:var(--bg);border:1px solid rgba(248,243,240,.22);
         border-radius:18px;box-shadow:0 12px 28px rgba(0,0,0,.4);transition:transform .25s ease,border-color .25s ease}
  .frame:hover{transform:translateY(-3px);border-color:var(--green)}
  .frame .in{display:flex;align-items:center;justify-content:center}

  .icons{display:flex;gap:18px;justify-content:center;position:relative;opacity:1;
         animation:rise .8s ease backwards}
  .icons .in{padding:18px}
  .ic{width:108px;height:108px;display:block}

  .frame-word{position:relative;width:100%;opacity:1;animation:rise .8s ease .12s backwards}
  .frame-word .in{padding:20px 26px}
  .word{width:100%;max-width:540px;height:auto;display:block;margin:0 auto}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* body */
  .body{padding:36px 38px 40px}
  .lbl{font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.22em;font-size:11px;
       text-transform:uppercase;color:var(--teal);margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(248,243,240,.18),transparent)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}
  .chip{border-radius:18px;height:140px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;
        position:relative;overflow:hidden;cursor:pointer;opacity:1;
        animation:pop .6s cubic-bezier(.2,.8,.3,1.1) backwards;
        transition:transform .22s cubic-bezier(.2,.8,.3,1.1),box-shadow .22s ease}
  .chip:nth-child(1){animation-delay:.22s}.chip:nth-child(2){animation-delay:.3s}
  .chip:nth-child(3){animation-delay:.38s}.chip:nth-child(4){animation-delay:.46s}
  .chip:hover{transform:translateY(-6px) scale(1.035);box-shadow:0 18px 34px rgba(0,0,0,.45);z-index:2}
  .chip:active{transform:translateY(-2px) scale(1.0)}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .chip .role{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.16em;font-size:11px;text-transform:uppercase;opacity:.9}
  .chip .hx{font-family:'Jost',sans-serif;font-weight:500;font-size:26px;letter-spacing:.02em}
  .chip .rgb{font-family:'Jost',sans-serif;font-weight:400;font-size:11px;letter-spacing:.05em;opacity:.6;margin-top:4px}
  .chip.teal{background:var(--teal);color:var(--light)}
  .chip.green{background:var(--green);color:var(--bg)}
  .chip.bg{background:var(--bg);color:var(--light);border:1px solid rgba(248,243,240,.22)}
  .chip.light{background:var(--light);color:var(--bg)}

  /* gradient */
  .grad{height:74px;border-radius:16px;background:linear-gradient(90deg,var(--teal),var(--green));
        box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:space-between;
        padding:12px 16px;cursor:pointer;animation:pop .6s cubic-bezier(.2,.8,.3,1.1) .5s backwards;
        transition:transform .22s ease,box-shadow .22s ease}
  .grad:hover{transform:scale(1.015);box-shadow:0 14px 30px rgba(0,0,0,.4)}
  .grad span{font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--light)}
  .grad span:last-child{color:var(--bg)}

  .credit{margin-top:26px;padding-top:18px;border-top:1px solid rgba(248,243,240,.12);text-align:center;
          font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.22em;
          text-transform:uppercase;color:rgba(248,243,240,.45)}

  @media(max-width:520px){
    .ic{width:84px;height:84px}.icons .in{padding:14px}.icons{gap:12px}
    .frame-word .in{padding:16px 18px}.hero{gap:16px;padding:36px 22px 40px}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <span class="orb a"></span><span class="orb b"></span>
      <div class="icons">
        <div class="frame"><div class="in"><img class="ic" src="logo_icon.svg" alt="VATSSA icon — solid"></div></div>
        <div class="frame"><div class="in"><img class="ic" src="logo_icon_clear.svg" alt="VATSSA icon — transparent fill"></div></div>
      </div>
      <div class="frame frame-word"><div class="in"><img class="word" src="logo_horizontal_white.svg" alt="VATSSA — Sub-Sahara Africa"></div></div>
    </div>
    <div class="body">
      <div class="lbl">Core Palette</div>
      <div class="grid">
        <div class="chip teal" data-hex="#0197B0"><span class="role">Teal · Primary</span><div><span class="hx">#0197B0</span><div class="rgb">RGB 1 · 151 · 176</div></div></div>
        <div class="chip green" data-hex="#7BD758"><span class="role">Green · Primary</span><div><span class="hx">#7BD758</span><div class="rgb">RGB 123 · 215 · 88</div></div></div>
        <div class="chip bg" data-hex="#07262C"><span class="role">Background</span><div><span class="hx">#07262C</span><div class="rgb">RGB 7 · 38 · 44</div></div></div>
        <div class="chip light" data-hex="#F8F3F0"><span class="role">Light · Text</span><div><span class="hx">#F8F3F0</span><div class="rgb">RGB 248 · 243 · 240</div></div></div>
      </div>

      <div class="lbl">Brand Gradient</div>
      <div class="grad"><span>#0197B0</span><span>#7BD758</span></div>

      <div class="credit">Made by George (1768227)</div>
    </div>
  </div>
<script>
  // click a colour to copy its hex
  document.querySelectorAll('.chip').forEach(c=>{
    const role=c.querySelector('.role'), original=role.textContent;
    c.addEventListener('click',()=>{
      const hex=c.dataset.hex;
      navigator.clipboard&&navigator.clipboard.writeText(hex);
      role.textContent='Copied '+hex;
      clearTimeout(c._t);
      c._t=setTimeout(()=>role.textContent=original,1200);
    });
  });
</script>
</body>
</html>
